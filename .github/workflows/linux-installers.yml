name: Linux installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: lumina-linux-installers
  cancel-in-progress: true

jobs:
  build-linux-mint-compatible:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: |
          npm run typecheck
          cargo fmt --all -- --check
          cargo test --workspace --locked

      - name: Build Student installers
        run: |
          npm run bundle:student
          mkdir -p artifacts/student
          cp target/release/bundle/deb/Lumina\ Student_*.deb artifacts/student/
          cp target/release/bundle/appimage/Lumina\ Student_*.AppImage artifacts/student/

      - name: Build Teacher installers
        run: |
          npm run bundle:teacher
          mkdir -p artifacts/teacher
          cp target/release/bundle/deb/Lumina\ Teacher_*.deb artifacts/teacher/
          cp target/release/bundle/appimage/Lumina\ Teacher_*.AppImage artifacts/teacher/

      - name: Verify installer set
        run: |
          test "$(find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' \) | wc -l)" -eq 4
          find artifacts -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-linux-x86_64
          if-no-files-found: error
          path: artifacts/
