name: Linux installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cinder-linux-installers
  cancel-in-progress: true

jobs:
  build-linux-mint-compatible:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: |
          npm run typecheck
          cargo fmt --all -- --check
          cargo test --workspace --locked

      - name: Build Student installers
        run: |
          npm run bundle:student
          mkdir -p artifacts/student
          cp target/release/bundle/deb/Cinder\ Student_*.deb artifacts/student/Cinder-Student-Linux-x86_64.deb
          cp target/release/bundle/appimage/Cinder\ Student_*.AppImage artifacts/student/Cinder-Student-Linux-x86_64.AppImage
          cp target/release/bundle/appimage/Cinder\ Student_*.AppImage.sig artifacts/student/Cinder-Student-Linux-x86_64.AppImage.sig

      - name: Build Teacher installers
        run: |
          npm run bundle:teacher
          mkdir -p artifacts/teacher
          cp target/release/bundle/deb/Cinder\ Teacher_*.deb artifacts/teacher/Cinder-Teacher-Linux-x86_64.deb
          cp target/release/bundle/appimage/Cinder\ Teacher_*.AppImage artifacts/teacher/Cinder-Teacher-Linux-x86_64.AppImage
          cp target/release/bundle/appimage/Cinder\ Teacher_*.AppImage.sig artifacts/teacher/Cinder-Teacher-Linux-x86_64.AppImage.sig

      - name: Create separate updater feeds
        env:
          RELEASE_BASE: https://github.com/Alfie3542/cinder-classroom/releases/download/matchbox-latest
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUBLISHED_AT" \
            --arg notes "Cinder Matchbox $VERSION" \
            --arg signature "$(cat artifacts/student/Cinder-Student-Linux-x86_64.AppImage.sig)" \
            --arg url "$RELEASE_BASE/Cinder-Student-Linux-x86_64.AppImage" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
            > artifacts/student/student-latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUBLISHED_AT" \
            --arg notes "Cinder Matchbox $VERSION" \
            --arg signature "$(cat artifacts/teacher/Cinder-Teacher-Linux-x86_64.AppImage.sig)" \
            --arg url "$RELEASE_BASE/Cinder-Teacher-Linux-x86_64.AppImage" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
            > artifacts/teacher/teacher-latest.json

      - name: Verify installer set
        run: |
          test "$(find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' \) | wc -l)" -eq 4
          test "$(find artifacts -type f -name '*.sig' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*-latest.json' | wc -l)" -eq 2
          jq -e '.platforms["linux-x86_64"].signature | length > 0' artifacts/student/student-latest.json
          jq -e '.platforms["linux-x86_64"].signature | length > 0' artifacts/teacher/teacher-latest.json
          find artifacts -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-linux-x86_64
          if-no-files-found: error
          path: artifacts/

      - name: Publish latest installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Cinder Matchbox update

            - Completed assignments are collapsed on Student devices.
            - Univer is now the primary Teacher Gradebook with improved sizing and scrolling.
            - The AI assistant can propose multiple columns and safe workbook cell changes for teacher review.
            - Grade suggestions still use Cinder's audited grade records and are never applied automatically.
            - AI responses use neutral pronouns when a person's pronouns are unknown.
            - Both apps can check GitHub Releases for signed updates from Settings.

            Built automatically from commit ${{ github.sha }}.
        run: |
          if gh release view matchbox-latest >/dev/null 2>&1; then
            gh release edit matchbox-latest --target "$GITHUB_SHA" --title "Cinder Matchbox — Latest Linux Installers" --notes "$RELEASE_NOTES" --latest
          else
            gh release create matchbox-latest --target "$GITHUB_SHA" --title "Cinder Matchbox — Latest Linux Installers" --notes "$RELEASE_NOTES" --latest
          fi
          gh release upload matchbox-latest artifacts/student/* artifacts/teacher/* --clobber
