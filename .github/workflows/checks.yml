name: Checks

# Runs the same verification as the release build, without building or signing
# installers, so a broken change is caught on its pull request instead of when
# a release fails.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run test:gradebook-intent
          npm run test:paper-logic
          npm run test:forge-notes
          npm run test:host-transport
          npm run audit:dependencies

      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
