[package]
name = "cinder-host-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cinder Host — local school server administration"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cinder-core.workspace = true
cinder-host.workspace = true
cinder-ai.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
chrono.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile = "3"
aes-gcm.workspace = true
# STREAM chunking for backup files that do not fit in memory.
aead = { version = "0.5", default-features = false, features = ["alloc", "stream"] }
argon2.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
