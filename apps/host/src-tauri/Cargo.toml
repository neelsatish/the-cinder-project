[package]
name = "cinder-host-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cinder Host — local school server administration"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cinder-core.workspace = true
cinder-host.workspace = true
