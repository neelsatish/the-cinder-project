<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cinder mark — Ember, reduced, gradient. Light scheme: Ash/Ember/Spark tips, warm centre glow, on Paper. -->
  <defs>
    <linearGradient id="outerL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="20" y2="0">
      <stop offset="0%" stop-color="#8A3A16"/>
      <stop offset="100%" stop-color="#2E160A"/>
    </linearGradient>
    <linearGradient id="midL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="26" y2="0">
      <stop offset="0%" stop-color="#E8792E"/>
      <stop offset="100%" stop-color="#B24E17"/>
    </linearGradient>
    <linearGradient id="coreL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="33" y2="0">
      <stop offset="0%" stop-color="#FFB566"/>
      <stop offset="100%" stop-color="#D9631F"/>
