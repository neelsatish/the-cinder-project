<!DOCTYPE html>
<html lang="en" data-theme="cinder" data-glass="probing">
<head>
<meta charset="UTF-8">
<title>Cinder Teacher — Ember Glass prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root[data-theme="cinder"] {
    color-scheme: dark;
    --background: #180d07;
    --surface-lowest: #1c0f08;
    --surface: #221309;
    --surface-raised: #2a180e;
    --surface-high: #392014;
    --border: rgba(243, 227, 198, 0.10);
    --border-strong: rgba(243, 227, 198, 0.20);
    --text: #f3e3c6;
    --text-soft: #ddc7a8;
    --muted: #a98c70;
    --primary: #dd8b36;
    --primary-strong: #f0a15c;
    --primary-ink: #221309;
    --accent-ink: #ffb566;
    --warm: #dd8b36;
    --warning: #efb15f;
    --danger: #ff897d;
    --success: #9ac083;
    --radius-sm: 4px;
    --radius: 8px;
    --radius-lg: 12px;

    --glass:        rgba(255, 246, 238, 0.06);
    --glass-strong: rgba(46, 26, 14, 0.78);
    --glass-line:   rgba(243, 227, 198, 0.12);
    --glass-hl:     inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --glass-blur:   28px;
  }

  * { box-sizing: border-box; }
  html, body, #root { width: 100%; height: 100%; margin: 0; }
  body {
    background: var(--background);
    color: var(--text);
    overflow: hidden;
    font-family: Inter, "Segoe UI", Ubuntu, Cantarell, system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---- ambient glow shell ---- */
  .app-frame {
    position: relative;
    display: flex;
    width: 100%;
    height: 100%;
    background-color: var(--background);
    overflow: hidden;
  }
  .app-frame::before,
  .app-frame::after {
    content: "";
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
    animation: glow-drift 48s ease-in-out infinite alternate;
  }
  .app-frame::before {
    background: radial-gradient(900px 620px at 82% -6%, rgba(217, 99, 31, 0.22), transparent 60%);
  }
  .app-frame::after {
    background: radial-gradient(760px 560px at 2% 108%, rgba(178, 78, 23, 0.16), transparent 64%);
    animation-delay: -24s;
  }
  @keyframes glow-drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(2%, -1.5%, 0) scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) {
    .app-frame::before, .app-frame::after { animation: none; }
  }

  /* ---- glass recipe: applies to nav rail, topbar, cards ---- */
  .glass, .nav-rail, .topbar {
    background: var(--glass);
    border: 1px solid var(--glass-line);
    box-shadow: var(--glass-hl), var(--glass-shadow);
  }
  html[data-glass="on"] .glass,
  html[data-glass="on"] .nav-rail,
  html[data-glass="on"] .topbar {
    backdrop-filter: blur(var(--glass-blur)) saturate(1.15);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.15);
  }

  .glass, .metric-card, .subject-card {
    transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 180ms ease-out;
  }
  .glass:hover, .metric-card:hover, .subject-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--glass-hl), 0 12px 28px rgba(0, 0, 0, 0.3);
  }

  /* ---- nav rail ---- */
  .nav-rail {
    position: relative;
    z-index: 1;
    width: 80px;
    flex: 0 0 80px;
    margin: 8px 0 8px 8px;
    border-radius: var(--radius-lg);
    height: calc(100% - 16px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rail-brand {
    height: 72px;
    display: grid;
    place-items: center;
    width: 100%;
    border-bottom: 1px solid var(--glass-line);
  }
  .rail-brand svg { width: 30px; height: 30px; }
  .rail-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px 0;
    width: 100%;
    align-items: center;
  }
  .rail-button {
    position: relative;
    width: 54px;
    height: 50px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
  }
  .rail-button svg { width: 21px; height: 21px; }
  .rail-button:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .rail-button.is-active {
    background: rgba(221, 139, 54, 0.15);
    color: var(--accent-ink);
    box-shadow: inset 2px 0 var(--primary);
  }
  .rail-button-label {
    position: absolute;
    bottom: 2px;
    font-size: 8px;
    font-weight: 650;
    letter-spacing: 0.02em;
    white-space: nowrap;
    max-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rail-logout { margin-top: auto; margin-bottom: 16px; }

  /* ---- stage / topbar ---- */
  .app-stage { position: relative; z-index: 1; min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .topbar {
    margin: 8px 8px 0 8px;
    border-radius: var(--radius-lg);
    height: 64px;
    flex: 0 0 64px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 24px;
  }
  .product-lockup { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .product-lockup svg { width: 24px; height: 24px; }
  .product-name { font-size: 15px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .product-divider { width: 1px; height: 20px; background: var(--border-strong); }
  .section-name { color: var(--text-soft); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .effects-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-line);
    font-size: 12px; font-weight: 650; color: var(--text-soft);
  }
  .effects-toggle button {
    border: 0; background: transparent; padding: 3px 8px; border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 700;
  }
  .effects-toggle button.active { background: var(--primary); color: var(--primary-ink); }
  .probe-readout { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .role-chip {
    padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    color: var(--accent-ink); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* ---- workspace ---- */
  .workspace { min-height: 0; flex: 1; overflow: auto; padding: 24px; }
  .page { max-width: 1400px; margin: 0 auto; animation: page-in 180ms ease-out; }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .page { animation: none; } }
  .page-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
  .page-header h1 { margin: 4px 0 6px; font-size: 28px; letter-spacing: -0.03em; }
  .eyebrow { margin: 0; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .page-description { max-width: 620px; margin: 0; color: var(--muted); line-height: 1.5; }

  .metrics { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .metric-card { border-radius: var(--radius); padding: 18px; min-height: 108px; }
  .metric-card span { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .metric-card strong { display: block; margin-top: 14px; font-size: 28px; letter-spacing: -0.03em; font-weight: 680; }
  .metric-card small { display: block; margin-top: 4px; color: var(--muted); }

  .grid { display: grid; gap: 18px; }
  .grid-main { grid-template-columns: minmax(0, 1.6fr) minmax(260px, 0.8fr); }
  .panel { border-radius: var(--radius); overflow: hidden; }
  .panel-header { min-height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--glass-line); }
  .panel-header h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .panel-body { padding: 16px 18px; }

  .list-item { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 0; border-bottom: 1px solid var(--glass-line); }
  .list-item:last-child { border-bottom: 0; }
  .list-icon { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--accent-ink); }
  .list-icon svg { width: 16px; height: 16px; }
  .list-copy strong { display: block; font-size: 13px; }
  .list-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

  /* ---- Students screen: dense table, deliberately OPAQUE (not glass) ---- */
  .data-table-wrap { border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; text-align: left; background: var(--surface-raised);
  }
  .data-table td { padding: 13px 16px; border-bottom: 1px solid var(--border); color: var(--text-soft); }
  .data-table tr:last-child td { border-bottom: 0; }
  .data-table tbody tr:hover { background: rgba(221, 139, 54, 0.06); }
  .data-table .primary-cell { color: var(--text); font-weight: 620; }
  .status-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: currentColor; margin-right: 6px; }
  .status-good { color: var(--success); }
  .status-warn { color: var(--warning); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .search-glass {
    flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px;
  }
  .search-glass svg { width: 16px; height: 16px; color: var(--muted); }
  .search-glass span { color: var(--muted); font-size: 13px; }
  .button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(255,255,255,0.04); font-size: 13px; font-weight: 650; }
  .button-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .button svg { width: 15px; height: 15px; }

  .view-switch { display: flex; gap: 6px; }
  .view-switch button { padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 650; }
  .view-switch button.active { background: var(--primary); color: var(--primary-ink); }
  .view-switch button:not(.active) { background: transparent; color: var(--muted); border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="app-frame">
  <aside class="nav-rail glass">
    <div class="rail-brand">
      <svg viewBox="0 0 64 64" fill="none">
        <g>
          <path d="M32 49 L20 20 L28 34 Z" fill="#6E3216"/>
          <path d="M32 49 L44 20 L36 34 Z" fill="#6E3216"/>
          <path d="M32 49 L23 26 L29 36 Z" fill="#DD8B36"/>
          <path d="M32 49 L41 26 L35 36 Z" fill="#DD8B36"/>
          <path d="M32 49 L32 18 L34 34 Z" fill="#D9631F"/>
          <circle cx="32" cy="49" r="5" fill="#D9631F"/>
        </g>
      </svg>
    </div>
    <nav class="rail-nav" id="rail-nav">
      <!-- populated by JS from the real navigation list -->
    </nav>
    <button class="rail-button rail-logout" title="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </button>
  </aside>

  <div class="app-stage">
    <header class="topbar glass">
      <div class="product-lockup">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M32 49 L20 20 L28 34 Z" fill="#6E3216"/><path d="M32 49 L44 20 L36 34 Z" fill="#6E3216"/>
          <path d="M32 49 L23 26 L29 36 Z" fill="#DD8B36"/><path d="M32 49 L41 26 L35 36 Z" fill="#DD8B36"/>
          <path d="M32 49 L32 18 L34 34 Z" fill="#D9631F"/><circle cx="32" cy="49" r="5" fill="#D9631F"/>
        </svg>
        <span class="product-name">Cinder Teacher</span>
        <span class="product-divider"></span>
        <span class="section-name" id="section-name">Overview</span>
      </div>
      <div class="topbar-actions">
        <span class="probe-readout" id="probe-readout">probing…</span>
        <div class="effects-toggle">
          <span>Effects</span>
          <button data-effects="on">On</button>
          <button data-effects="fallback">Off</button>
          <button data-effects="auto" class="active">Auto</button>
        </div>
        <span class="role-chip">Teacher</span>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <!-- pages injected by JS -->
    </main>
  </div>
</div>

<script>
(function () {
  var icons = {
    dashboard: '<path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/>',
    students: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 13.6c2.6.3 4.5 2.1 4.5 4.7"/>',
    classrooms: '<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/>',
    assignments: '<path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M9 12h6M9 16h6M9 8h3"/>',
    attendance: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M8 14l2.5 2.5L16 11"/>',
    spreadsheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
    assistant: '<path d="M12 3a5 5 0 015 5v2a5 5 0 01-10 0V8a5 5 0 015-5z"/><path d="M6 21c0-3.3 2.7-5 6-5s6 1.7 6 5"/>',
    settings: '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 000-3l1.1-1.9-1.7-1.7-1.9 1.1a1.7 1.7 0 00-3 0L12 5h-2.4l-1.9 1.1a1.7 1.7 0 00-3 0L3 8.6l1.1 1.9a1.7 1.7 0 000 3L3 15.4l1.7 1.7 1.9-1.1a1.7 1.7 0 003 0L12 19h2.4l1.9-1.1a1.7 1.7 0 003 0l1.9 1.1 1.7-1.7-1.1-1.9z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    checkin: '<path d="M20 6L9 17l-5-5"/>',
    file: '<path d="M6 2h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M9 12h6M9 16h6"/>',
    bell: '<path d="M12 2a6 6 0 00-6 6v2.7c0 .5-.2.9-.5 1.3L4 14.5V16h16v-1.5l-1.5-1.5a1.9 1.9 0 01-.5-1.3V8a6 6 0 00-6-6z"/><path d="M9.5 19a2.5 2.5 0 005 0"/>'
  };
  function svg(name, cls) {
    return '<svg class="' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + icons[name] + '</svg>';
  }

  var navigation = [
    { id: "dashboard", label: "Overview", icon: "dashboard" },
    { id: "students", label: "Students", icon: "students" },
    { id: "classrooms", label: "Classrooms", icon: "classrooms" },
    { id: "assignments", label: "Assignments", icon: "assignments" },
    { id: "attendance", label: "Attendance", icon: "attendance" },
    { id: "gradebook", label: "Gradebook", icon: "spreadsheet" },
    { id: "assistant", label: "AI assistant", icon: "assistant" },
    { id: "settings", label: "Settings", icon: "settings" }
  ];

  var railNav = document.getElementById('rail-nav');
  navigation.forEach(function (item) {
    var btn = document.createElement('button');
    btn.className = 'rail-button' + (item.id === 'dashboard' ? ' is-active' : '');
    btn.dataset.tab = item.id;
    btn.title = item.label;
    btn.innerHTML = svg(item.icon);
    btn.addEventListener('click', function () { setTab(item.id, item.label); });
    railNav.appendChild(btn);
  });

  var pages = {
    dashboard: function () {
      return (
        '<div class="page">' +
          '<div class="page-header"><div><p class="eyebrow">This week</p><h1>Overview</h1><p class="page-description">Attendance, assignments due, and what changed since you last opened the app.</p></div></div>' +
          '<div class="metrics">' +
            metric('Students', '128', 'across 4 classrooms') +
            metric('Attendance today', '96%', '3 not yet marked') +
            metric('Assignments due', '5', 'this week') +
            metric('Unread messages', '2', 'from parents') +
          '</div>' +
          '<div class="grid grid-main">' +
            '<section class="panel glass"><div class="panel-header"><h2>Due soon</h2></div><div class="panel-body">' +
              listItem('file', 'Fractions worksheet', 'Year 5 Maths — due tomorrow') +
              listItem('file', 'Reading log', 'Year 4 English — due in 3 days') +
              listItem('file', 'Science quiz', 'Year 5 Science — due in 5 days') +
            '</div></section>' +
            '<section class="panel glass"><div class="panel-header"><h2>Recent activity</h2></div><div class="panel-body">' +
              listItem('checkin', 'Attendance marked', 'Year 5 Maths — this morning') +
              listItem('checkin', 'Assignment graded', '18 of 24 submissions') +
              listItem('bell', 'Parent message', 'From Sarah T. — yesterday') +
            '</div></section>' +
          '</div>' +
        '</div>'
      );
    },
    students: function () {
      var rows = [
        ['Amelia Clarke', 'Year 5 Maths', 'good', 'Present'],
        ['Noah Fitzgerald', 'Year 5 Maths', 'good', 'Present'],
        ['Priya Shah', 'Year 4 English', 'warn', 'Not marked'],
        ['Oliver Bennett', 'Year 5 Science', 'good', 'Present'],
        ['Isla McKenzie', 'Year 4 English', 'good', 'Present'],
        ['Ethan Wallace', 'Year 5 Maths', 'warn', 'Absent'],
        ['Freya Douglas', 'Year 5 Science', 'good', 'Present']
      ];
      return (
        '<div class="page">' +
          '<div class="page-header"><div><p class="eyebrow">128 students</p><h1>Students</h1><p class="page-description">Everyone across your four classrooms. Dense data stays opaque — glass is chrome, not content.</p></div>' +
            '<button class="button button-primary">' + svg('plus') + 'Add student</button>' +
          '</div>' +
          '<div class="toolbar"><div class="search-glass glass">' + svg('search') + '<span>Search students</span></div>' +
            '<div class="view-switch"><button class="active">All</button><button>Year 4</button><button>Year 5</button></div></div>' +
          '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Classroom</th><th>Today</th></tr></thead><tbody>' +
            rows.map(function (r) {
              return '<tr><td class="primary-cell">' + r[0] + '</td><td>' + r[1] + '</td><td><span class="status-dot status-' + r[2] + '"></span>' + r[3] + '</td></tr>';
            }).join('') +
          '</tbody></table></div>' +
        '</div>'
      );
    }
  };

  function metric(label, value, sub) {
    return '<div class="metric-card glass"><span>' + label + '</span><strong>' + value + '</strong><small>' + sub + '</small></div>';
  }
  function listItem(icon, title, sub) {
    return '<div class="list-item"><div class="list-icon">' + svg(icon) + '</div><div class="list-copy"><strong>' + title + '</strong><span>' + sub + '</span></div></div>';
  }

  var workspace = document.getElementById('workspace');
  var sectionName = document.getElementById('section-name');
  function setTab(id, label) {
    document.querySelectorAll('.rail-button').forEach(function (b) {
      b.classList.toggle('is-active', b.dataset.tab === id);
    });
    sectionName.textContent = label;
    workspace.innerHTML = (pages[id] || pages.dashboard)();
  }
  setTab('dashboard', 'Overview');

  // ---- capability probe ----
  var html = document.documentElement;
  var readout = document.getElementById('probe-readout');

  function applyGlassState(state, extra) {
    html.setAttribute('data-glass', state);
    readout.textContent = extra || state;
  }

  function probeGlassCapability() {
    return new Promise(function (resolve) {
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;z-index:-1;opacity:0.01;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);';
      document.body.appendChild(el);

      var frameTimes = [];
      var last = performance.now();
      var count = 0;
      function tick(now) {
        frameTimes.push(now - last);
        last = now;
        count += 1;
        if (count < 12) {
          requestAnimationFrame(tick);
        } else {
          document.body.removeChild(el);
          var sample = frameTimes.slice(2);
          var avg = sample.reduce(function (a, b) { return a + b; }, 0) / sample.length;
          resolve({ capable: avg < 20, avgFrameMs: avg });
        }
      }
      requestAnimationFrame(tick);
    });
  }

  var effectsOverride = 'auto';
  var lastProbe = null;

  function resolveState() {
    if (effectsOverride === 'on') return applyGlassState('on', 'on (forced)');
    if (effectsOverride === 'fallback') return applyGlassState('fallback', 'off (forced)');
    if (lastProbe) applyGlassState(lastProbe.capable ? 'on' : 'fallback', 'auto — ' + lastProbe.avgFrameMs.toFixed(1) + 'ms/frame');
  }

  document.querySelectorAll('.effects-toggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.effects-toggle button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      effectsOverride = btn.dataset.effects;
      resolveState();
    });
  });

  probeGlassCapability().then(function (result) {
    lastProbe = result;
    resolveState();
  });
})();
</script>
